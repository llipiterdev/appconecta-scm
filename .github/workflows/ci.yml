name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permiso minimo a nivel de workflow. Ningun job de CI necesita escribir en el repositorio.
permissions:
  contents: read

jobs:
  commits:
    name: Mensajes de commit (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Los commits ordinarios se validan con el reglamento completo, cabecera y cuerpo.
      #
      # Los commits de merge reciben un trato acotado a su cabecera. La razon no es indulgencia:
      # su cuerpo lo compone GitHub al integrar y, una vez publicado en una rama permanente,
      # corregirlo exigiria reescribir historia, que es precisamente lo que la estrategia de ramas
      # prohibe. La cabecera si es responsabilidad de quien integra y se sigue exigiendo.
      - name: Validar mensajes del pull request
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          commitlint=./node_modules/.bin/commitlint
          fallos=0

          validar() {
            local sha="$1" alcance="$2" mensaje
            if [ "$alcance" = "cabecera" ]; then
              mensaje=$(git log -1 --format=%s "$sha")
            else
              mensaje=$(git log -1 --format=%B "$sha")
            fi

            if printf '%s\n' "$mensaje" | "$commitlint" --verbose > /tmp/commitlint.out 2>&1; then
              echo "ok      $(git log -1 --format=%h "$sha")  $(git log -1 --format=%s "$sha")"
            else
              echo "fallo   $(git log -1 --format=%h "$sha")  $(git log -1 --format=%s "$sha")"
              sed 's/^/        /' /tmp/commitlint.out
              fallos=$((fallos + 1))
            fi
          }

          echo "== Commits ordinarios (cabecera y cuerpo) =="
          ordinarios=0
          for sha in $(git rev-list --no-merges "$base..$head"); do
            validar "$sha" completo
            ordinarios=$((ordinarios + 1))
          done

          echo "== Commits de merge (solo cabecera) =="
          merges=0
          for sha in $(git rev-list --merges "$base..$head"); do
            validar "$sha" cabecera
            merges=$((merges + 1))
          done

          {
            echo "### Mensajes de commit"
            echo ""
            echo "| Alcance de la validacion | Commits |"
            echo "| --- | --- |"
            echo "| Ordinarios: cabecera y cuerpo | $ordinarios |"
            echo "| Merge: solo cabecera | $merges |"
            echo ""
            if [ "$fallos" -eq 0 ]; then
              echo "Todos los mensajes cumplen Conventional Commits."
            else
              echo "**$fallos mensajes incumplen la convencion.** El detalle esta en el log del job."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          [ "$fallos" -eq 0 ]

  quality:
    name: Calidad estatica
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar formato (Prettier)
        run: npm run format:check

      - name: Analisis estatico (ESLint)
        run: npm run lint

      - name: Verificacion de tipos (TypeScript)
        run: npm run typecheck

  test:
    name: Pruebas unitarias y de componentes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas con cobertura
        run: npm run test:coverage

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          retention-days: 14

      - name: Resumen de cobertura
        if: always()
        run: |
          {
            echo "### Cobertura de pruebas"
            echo ""
            node -e "
              const total = require('./coverage/coverage-summary.json').total;
              console.log('| Indicador | Cobertura | Cubierto |');
              console.log('| --- | --- | --- |');
              for (const key of ['statements', 'branches', 'functions', 'lines']) {
                const item = total[key];
                console.log('| ' + key + ' | ' + item.pct + ' % | ' + item.covered + '/' + item.total + ' |');
              }
            "
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build de produccion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build

      - name: Publicar artefacto de distribucion
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 14

      - name: Resumen del artefacto
        run: |
          {
            echo "### Artefacto de distribucion"
            echo ""
            echo "| Dato | Valor |"
            echo "| --- | --- |"
            echo "| Version | $(node -p "require('./package.json').version") |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Tamano de dist/ | $(du -sh dist | cut -f1) |"
            echo "| Archivos | $(find dist -type f | wc -l) |"
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: Pruebas end-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium

      - name: Compilar la aplicacion
        run: npm run build

      - name: Ejecutar flujos criticos
        run: npm run test:e2e

      - name: Publicar reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ github.sha }}
          path: |
            reports/playwright/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  metrics:
    name: Metricas y control de no regresion
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Auditoria de dependencias (umbral high)
        run: npm run metrics:audit

      - name: Registrar auditoria en formato JSON
        if: always()
        run: |
          mkdir -p reports
          npm audit --json > reports/audit.json || true

      - name: Medir complejidad ciclomatica
        run: npm run metrics:complexity

      - name: Medir duplicacion de codigo
        run: npm run metrics:duplication

      - name: Medir cobertura
        run: npm run test:coverage

      - name: Control de no regresion frente a la baseline
        run: npm run metrics:gate

      - name: Publicar reportes de metricas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-${{ github.sha }}
          path: reports/
          retention-days: 14
          if-no-files-found: ignore

      - name: Resumen de metricas
        if: always()
        run: |
          {
            echo "### Metricas medidas"
            echo ""
            node -e "
              const complexity = require('./reports/complexity.json').totals;
              const duplication = require('./reports/duplication/jscpd-report.json').statistics.total;
              const coverage = require('./coverage/coverage-summary.json').total;
              const baseline = require('./metrics-baseline.json');
              console.log('| Indicador | Medido | Baseline |');
              console.log('| --- | --- | --- |');
              console.log('| Complejidad ciclomatica maxima | ' + complexity.maxComplexity + ' | ' + baseline.complexity.maxComplexity + ' |');
              console.log('| Lineas del archivo mayor | ' + complexity.largestFileLines + ' | ' + baseline.complexity.largestFileLines + ' |');
              console.log('| Duplicacion | ' + duplication.percentage + ' % | ' + baseline.duplication.percentage + ' % |');
              console.log('| Clones | ' + duplication.clones + ' | ' + baseline.duplication.clones + ' |');
              console.log('| Cobertura de sentencias | ' + coverage.statements.pct + ' % | ' + baseline.coverage.statements + ' % |');
              console.log('| Cobertura de ramas | ' + coverage.branches.pct + ' % | ' + baseline.coverage.branches + ' % |');
            "
            echo ""
            echo "La deuda registrada en \`docs/technical-debt-register.md\` puede permanecer, pero no crecer."
          } >> "$GITHUB_STEP_SUMMARY"

  container:
    name: Construccion de la imagen de contenedor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v5

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: appconecta-scm:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verificar que la imagen sirve la aplicacion
        run: |
          # Sin --rm: si el contenedor termina al arrancar, sus logs deben sobrevivir para poder
          # diagnosticar la causa. Un contenedor eliminado se lleva consigo la unica evidencia.
          docker run -d --name appconecta-ci -p 8080:8080 appconecta-scm:ci-${{ github.sha }}

          verificar() {
            # La ruta profunda comprueba que el fallback de la SPA funciona: sin el, cualquier
            # enlace directo a una seccion devolveria 404 desde el servidor.
            curl --fail --silent --show-error http://127.0.0.1:8080/ > /dev/null &&
              curl --fail --silent --show-error http://127.0.0.1:8080/incapacidades > /dev/null
          }

          for attempt in $(seq 1 12); do
            if verificar; then
              echo "La imagen responde en la raiz y en una ruta profunda (intento $attempt)."
              docker rm -f appconecta-ci > /dev/null
              exit 0
            fi
            echo "Intento $attempt sin respuesta; reintentando en 5 s."
            sleep 5
          done

          echo "La imagen no respondio tras 12 intentos. Logs del contenedor:"
          docker logs appconecta-ci || true
          docker inspect --format 'Estado: {{.State.Status}} (codigo de salida {{.State.ExitCode}})' appconecta-ci || true
          docker rm -f appconecta-ci > /dev/null || true
          exit 1

      - name: Resumen de la imagen
        if: always()
        run: |
          {
            echo "### Imagen de contenedor"
            echo ""
            echo "| Dato | Valor |"
            echo "| --- | --- |"
            echo "| Etiqueta | \`appconecta-scm:ci-${{ github.sha }}\` |"
            echo "| Verificacion | peticion HTTP con reintentos |"
          } >> "$GITHUB_STEP_SUMMARY"
