name: Publicacion de version

on:
  push:
    # Solo versiones liberadas. Un tag de candidato como v0.2.0-rc.1 identifica una baseline de
    # desarrollo, no una entrega: no debe producir un release ni publicar una imagen. El patron
    # exige que el ref termine en el numero de parche, de modo que cualquier sufijo de
    # pre-release queda fuera.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

  # Permite repetir la publicacion de un tag que ya existe. Si la ejecucion automatica falla por un
  # defecto del propio workflow, la alternativa seria mover el tag para volver a dispararlo, y un
  # tag que se mueve deja de identificar una baseline. Esta entrada evita esa tentacion.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag de version a publicar, por ejemplo v0.2.0
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verificar la version etiquetada
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      # Se extrae el arbol del tag y no el de la rama por defecto. En una ejecucion manual son
      # cosas distintas, y verificar una version contra un codigo que no es el suyo no verifica
      # nada.
      - name: Checkout del tag
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      # Un tag que no coincide con package.json produce una version imposible de rastrear: el
      # release dice una cosa y el artefacto otra. Es el error mas facil de cometer al liberar y
      # el mas caro de descubrir despues, de modo que se comprueba antes que nada.
      - name: Validar el formato y la coincidencia con package.json
        id: version
        run: |
          tag="$RELEASE_TAG"
          version="${tag#v}"

          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "El tag $tag no sigue el formato SemVer vX.Y.Z."
            exit 1
          fi

          declarada=$(node -p "require('./package.json').version")

          if [ "$version" != "$declarada" ]; then
            echo "El tag declara $version y package.json declara $declarada."
            echo "Un release cuyo tag y artefacto discrepan no es rastreable."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Version $version verificada."

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificaciones criticas
        run: |
          npm run lint
          npm run typecheck

      # El control de no regresion compara contra archivos de medicion: el resumen de cobertura, el
      # informe de complejidad y el de duplicacion. Sin generarlos antes, el script no encuentra
      # nada que comparar. Se miden aqui en el mismo orden que en el pipeline de integracion.
      - name: Medir antes de comparar
        run: |
          npm run metrics:complexity
          npm run metrics:duplication
          npm run metrics:audit
          npm run test:coverage

      - name: Control de no regresion frente a la baseline
        run: npm run metrics:gate

  artifact:
    name: Publicar el artefacto de la version
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write

    steps:
      - name: Checkout del tag
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Construir la aplicacion
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      # La suma de verificacion permite comprobar que el archivo descargado es el mismo que produjo
      # el pipeline. Sin ella, el artefacto adjunto es solo un archivo con un nombre de version.
      - name: Empaquetar y calcular la suma de verificacion
        id: paquete
        run: |
          nombre="appconecta-v${{ needs.verify.outputs.version }}-dist.tar.gz"
          tar --create --gzip --file "$nombre" --directory dist .
          sha256sum "$nombre" > "$nombre.sha256"

          echo "nombre=$nombre" >> "$GITHUB_OUTPUT"
          cat "$nombre.sha256"

      - name: Adjuntar los artefactos al release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "${{ steps.paquete.outputs.nombre }}" \
            "${{ steps.paquete.outputs.nombre }}.sha256" \
            --clobber

  container:
    name: Publicar la imagen en GHCR
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      packages: write

    steps:
      - name: Checkout del tag
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # El registro es el propio de GitHub y el token lo emite la plataforma para esta ejecucion.
      # No hay ningun secreto que configurar, que es lo que hace el pipeline reproducible en un
      # fork sin intervencion previa.
      - name: Autenticarse en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Calcular las etiquetas de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # Las etiquetas se derivan de la version verificada y no del ref del evento. En una
          # ejecucion manual el ref es la rama, no el tag, y dejar que la accion lo dedujera
          # produciria una imagen etiquetada con el nombre de la rama.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.verify.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.verify.outputs.version }}
            type=raw,value=sha-${{ needs.verify.outputs.sha }}
          labels: |
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}

      - name: Construir y publicar
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_PATH=/
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Registrar la imagen publicada
        run: |
          {
            echo "### Imagen publicada en GHCR"
            echo ""
            echo "| Dato | Valor |"
            echo "| --- | --- |"
            echo "| Digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| Version | \`${{ needs.verify.outputs.version }}\` |"
            echo ""
            echo "Etiquetas:"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
