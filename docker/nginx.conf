server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La aplicacion es una SPA: cualquier ruta desconocida debe resolverse en el cliente, no
    # devolver 404 desde el servidor.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El service worker y el manifiesto no deben cachearse: una version antigua impediria que
    # el usuario recibiera actualizaciones.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:js|css|woff2|svg|png|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
